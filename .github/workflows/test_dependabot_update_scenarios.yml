name: test_dependabot_update_scenarios

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read



# ====================================
# DEPENDABOT ANALYSIS RESULTS
# ====================================
#
# Interesting: If same action is called within job (or even whole workflow) multiple times with different refs,
# then dependabot should update every ref according to the config. But dependabot computes one new version and then sets it everywhere
# This even lead to the fact that a checkout call with v6.0.0 was downgraded to version 4.3.1
#
# When a repo has no tags at all and the ref is a commit sha, then dependabot should update to the latest commit on the default branch.
# To make it work simply create on any commit on the main branch a tag v.0.0.0 or maybe also v0.0.1 and then dependabot will update to the latest commit on the main branch
#
# When a ref is done via a branch (e.g. actions/checkout@main), then dependabot should update to the latest commit on that branch, but it does not do anything
#
# Assumption: By default all updates shall be semver compatible (minor and/or patch version update) even if the current reference e.g. 4.2 is already superseeded by new major versions
# e.g. 6.0.2
#
#  Overall it can be said that dependabot does the following:
# 1) If ref is a semver tag, then update to the latest semver compatible tag
# 2) If ref is a commit sha with version comment, then update to the commit that the newest semver compatible tag points to
# 3) If ref is a commit sha without version comment and not version tags in the repo, then update to the latest commit of the default branch
#
# Dependabot does NOT support the following:
# - Replace any non commit sha ref (e.g. branch or tag) by a commit sha and then apply update rules
# - Cannot update to a new major version in all repos without touching in every repo the dependabot file to allow again major updates for certain dependencies.
#   After that update was done and the pr was merged, the depbot config has to be changed again to exclude major updates for the dependencies where major updates should no more be applied.
#   Reason for this approach: Infra team wants to control major version updates more strictly and not have them automatically applied everywhere, but for minor
#   and patch updates they want to benefit from the automatic updates.
# - If a repo has multiple path based tags, e.g. dummy-composite/v1.0.0, dummy-composite/v1.0.1, dummy-workflow/v1.0.0, dummy-workflow/v1.1.0, etc. then dependabot cannot do an update

jobs:
  dependabot-update-scenario-tests-steps-fixture-3:
    runs-on: ubuntu-latest
    steps:
      - name: Log fixture purpose
        run: echo "This workflow is a dependabot reference fixture; scenario refs are intentionally non-executing."
      - name: Action reference via branch (intentionally old style for dependabot updates)
        # Intentionally disabled: this workflow is a static dependency fixture for dependabot updates.
        if: ${{ false }}
        # expected_behavior: latest_commit_on_branch
        uses: actions/checkout@main
  dependabot-update-scenario-tests-steps-fixture-2:
    runs-on: ubuntu-latest
    steps:
      - name: Log fixture purpose
        run: echo "This workflow is a dependabot reference fixture; scenario refs are intentionally non-executing."
      - name: Action reference via tag
        # Intentionally disabled: this workflow is a static dependency fixture for dependabot updates.
        if: ${{ false }}
        # expected_behavior: latest_commit for 6.x version
        # v6.0.0 tag points to commit 1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        uses: actions/checkout@v6.0.0

  dependabot-update-scenario-tests-steps-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Log fixture purpose
        run: echo "This workflow is a dependabot reference fixture; scenario refs are intentionally non-executing."
      - name: Action reference via semver tag (intentionally old for dependabot updates)
        if: ${{ false }}
        # expected_behavior: replace tag by commit sha that the tag points to
        # The v3 tag is already the latest 3.x version since the latest tag v3.9.1 points to the same commit like v3
        # Commit for v3: 3235b876344d2a9aa001b8d1453c930bba69e610
        uses: actions/setup-node@v3
      - name: Action reference via commit with version comment
        if: ${{ false }}
        # expected_behavior: newest_semver_compatible_tag_commit
        # 0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 & v3
        # 1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      - name: Action reference via commit with version comment
        if: ${{ false }}
        # expected_behavior: newest_semver_compatible_tag_commit
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # 4.2.0
      - name: Action reference via commit with major version comment
        if: ${{ false }}
        # expected_behavior: newest_semver_compatible_tag_commit
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
      - name: Action reference via commit with wrong version comment
        if: ${{ false }}
        # v4.7.12 does not exist at all
        # expected_behavior: newest_semver_compatible_tag_commit for 4.x
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.7.12

      - name: Action reference via commit without version comment
        if: ${{ false }}
        # expected_behavior: Resolve commit to semver tag and then update to newest semver compatible tag
        # Expected commit sha is 34e114876b0b11c390a56381ad16ebd13914f8d5 which is version v4.3.1
        # Commit that belongs to version 4.1.0
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Action reference via commit without version comment and without any tags in the repo
        if: ${{ false }}
        # expected/wished behavior: Replace current commit by latest commit on default branch
        # result: No update at all since there is no comment saying from where to update
        uses: mtombosch/cicd-actions/inter-repo-access@51883d9cd772bee5b7d139a2e6ffd8aeabca4224

      - name: Action reference via commit with multi path version comment
        if: ${{ false }}
        # expected_behavior: update tag to dummy-composite/v1.0.1 or next minor version if it exists
        # Repo has multiple tags (for the dummy action and dummy workflow)
        uses: mtombosch/dependabot_update_scenarios_test/.github/actions/dummy-composite@150be11f8e18450c38116b01268b2b7119b87931 # dummy-composite/v1.0.0

      - name: Action reference via commit with multi path version comment 2
        if: ${{ false }}
        # expected_behavior: update tag to dummy-composite/v1.0.1 or next minor version if it exists
        # Repo has multiple tags (for the dummy action and dummy workflow)
        uses: mtombosch/dependabot_update_scenarios_test/.github/actions/dummy-composite@dummy-composite/v1.0.0


  workflow-reference-via-branch-fixture:
    if: ${{ false }}
    # Repo has no tags at all
    # expected_behavior: latest_commit_on_branch
    uses: actions/reusable-workflows/.github/workflows/basic-validation.yml@main
  workflow-reference-via-commit-fixture:
    if: ${{ false }}
    # expected_behavior: latest_commit_on_branch
    # Repo has some tags v0.0.0 and v0.0.1 on non-latest commits, but commit reference is on main branch and is newer than the tags
    # Commit is from May 12 2026
    uses: mtombosch/cicd-workflows/.github/workflows/copyright.yml@a2885534f75cf360ecb1b3c589778846bcd4e170
  workflow-reference-via-branch-fixture-2:
    if: ${{ false }}
    # expected_behavior: latest_commit_on_branch
    # Repo has some tags v0.0.0 and v0.0.1
    uses: mtombosch/cicd-workflows/.github/workflows/bzlmod-lock-check.yml@af347722c7ae3ed85518895c11268d96ac728f62 # main
  workflow-reference-via-commit-with-multipath-version-fixture:
    if: ${{ false }}
    # expected_behavior: update tag to dummy-workflow/v1.3.0
    # Repo has multiple tags (for the dummy action and dummy workflow)
    uses: mtombosch/dependabot_update_scenarios_test/.github/workflows/dummy_reusable_workflow.yml@150be11f8e18450c38116b01268b2b7119b87931 # dummy-workflow/v1.1.0
  workflow-reference-via-commit-with-multipath-version-fixture-2:
    if: ${{ false }}
    # expected_behavior: update tag to dummy-workflow/v1.3.0
    # Repo has multiple tags (for the dummy action and dummy workflow)
    uses: mtombosch/dependabot_update_scenarios_test/.github/workflows/dummy_reusable_workflow.yml@dummy-workflow/v1.1.0

  workflow-reference-via-commit-with-version-comment-fixture:
    if: ${{ false }}
    # expected_behavior: newest_semver_compatible_tag_commit
    # Repo has no tags so version comment is invalid, but commit exists (commit date Jan 21, 2025)
    uses: actions/reusable-workflows/.github/workflows/basic-validation.yml@95d9656793415e47f574f7967f3850ea3bf5a7ed # v1.0.0

  workflow-reference-via-commit-without-version-comment-fixture:
    if: ${{ false }}
    # expected_behavior: inferred_tag_then_newest_semver_compatible_tag_commit
    # Repo has no tags at all
    uses: actions/reusable-workflows/.github/workflows/basic-validation.yml@95d9656793415e47f574f7967f3850ea3bf5a7ed # main - some arbitrary comment
